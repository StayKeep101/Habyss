name: macOS checks
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: bun run --cwd apps/desktop tauri build --bundles app
      - uses: actions/upload-artifact@v4
        with:
          name: Habyss-macOS-development
          path: apps/desktop/src-tauri/target/release/bundle/macos/Habyss.app
