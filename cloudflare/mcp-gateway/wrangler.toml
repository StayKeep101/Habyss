# The short public address for Habyss's MCP server, and its "Sign in with Habyss"
# page. Deploy: see cloudflare/mcp-gateway/README.md.
name = "habyss-mcp"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
# Top-level keys must come before [vars], or TOML reads them as variables.
routes = [{ pattern = "mcp.habyss.app", custom_domain = true }]

[vars]
SUPABASE_URL = "https://wlbjhtlznzdumqxetilx.supabase.co"
# The short public address (also the route above).
PUBLIC_URL = "https://mcp.habyss.app"
# SUPABASE_KEY (the app's public key) is set with: npx wrangler secret put SUPABASE_KEY
